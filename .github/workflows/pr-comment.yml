name: PR Comment with CI Results

on:
  workflow_run:
    workflows: ["Ultimate CI"]
    types: [completed]

permissions:
  pull-requests: write
  issues: write
  actions: read
  checks: write

jobs:
  comment:
    name: Post PR Comment
    runs-on: ubuntu-latest

    steps:
      - name: Debug workflow run info
        run: |
          echo "Workflow run event: ${{ github.event.workflow_run.event }}"
          echo "Workflow run conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "Workflow run status: ${{ github.event.workflow_run.status }}"
          echo "Head branch: ${{ github.event.workflow_run.head_branch }}"
          echo "Head SHA: ${{ github.event.workflow_run.head_sha }}"
          echo "Run ID: ${{ github.event.workflow_run.id }}"

      - name: Find associated PR
        id: find-pr
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            console.log("Looking for open PR with head branch:", run.head_branch);
            console.log("Workflow run event type:", run.event);

            // Only process pull_request events
            if (run.event !== 'pull_request') {
              console.log("Skipping: not a pull_request event (was:", run.event, ")");
              core.setOutput('found', 'false');
              core.setOutput('reason', 'not-a-pr-event');
              return;
            }

            const { data: pullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${run.head_branch}`
            });

            if (pullRequests.length === 0) {
              console.log("No open PR found for branch:", run.head_branch);
              core.setOutput('found', 'false');
              core.setOutput('reason', 'no-open-pr');
              return;
            }

            const pr = pullRequests[0];
            console.log("Found PR #" + pr.number + ": " + pr.title);
            core.setOutput('found', 'true');
            core.setOutput('number', pr.number);
            core.setOutput('title', pr.title);
            core.setOutput('author', pr.user.login);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('base_sha', pr.base.sha);

      - name: Fetch jobs and post comment
        if: steps.find-pr.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.payload.workflow_run.id;
            const prNumber = parseInt('${{ steps.find-pr.outputs.number }}');
            const prTitle = '${{ steps.find-pr.outputs.title }}';
            const prAuthor = '${{ steps.find-pr.outputs.author }}';
            const headSha = '${{ steps.find-pr.outputs.head_sha }}';
            const run = context.payload.workflow_run;

            console.log("Fetching jobs for run", runId);

            // Fetch all jobs for this workflow run
            const { data: jobsData } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId
            });

            const jobs = jobsData.jobs;
            console.log("Found", jobs.length, "jobs");

            const jobMap = {};
            jobs.forEach(job => {
              jobMap[job.name] = {
                conclusion: job.conclusion,
                status: job.status,
                url: job.html_url,
                started_at: job.started_at,
                completed_at: job.completed_at
              };
            });

            const getDuration = (job) => {
              if (!job.started_at || !job.completed_at) return 'N/A';
              const start = new Date(job.started_at);
              const end = new Date(job.completed_at);
              const secs = Math.round((end - start) / 1000);
              return secs < 60 ? `${secs}s` : `${Math.floor(secs/60)}m ${secs%60}s`;
            };

            const getEmoji = (conclusion) => {
              if (conclusion === 'success') return '✅';
              if (conclusion === 'failure') return '❌';
              if (conclusion === 'skipped') return '⏭️';
              if (conclusion === 'cancelled') return '🚫';
              return '⏳';
            };

            const relevantJobs = [
              { key: 'Setup & Cache', label: 'Setup', icon: '📦' },
              { key: 'Commit Lint', label: 'Commit', icon: '📝' },
              { key: 'TypeScript', label: 'TypeScript', icon: '🔍' },
              { key: 'ESLint', label: 'ESLint', icon: '🧹' },
              { key: 'Tests & Coverage', label: 'Tests', icon: '🧪' },
              { key: 'Build', label: 'Build', icon: '🏗️' },
              { key: 'Security Audit', label: 'Audit', icon: '🔒' },
              { key: 'Prettier', label: 'Prettier', icon: '✨' },
              { key: 'Final Summary', label: 'Summary', icon: '📊' }
            ];

            let resultsTable = '| Check | Status | Duration | Link |\n';
            resultsTable += '|-------|--------|----------|------|\n';

            let passCount = 0;
            let failCount = 0;
            let skipCount = 0;

            relevantJobs.forEach(({ key, label, icon }) => {
              const job = jobMap[key];
              if (job) {
                const emoji = getEmoji(job.conclusion);
                const duration = getDuration(job);
                const link = `[Logs](${job.url})`;
                resultsTable += `| ${icon} ${label} | ${emoji} ${job.conclusion} | ${duration} | ${link} |\n`;
                if (job.conclusion === 'success') passCount++;
                else if (job.conclusion === 'failure') failCount++;
                else if (job.conclusion === 'skipped') skipCount++;
              } else {
                resultsTable += `| ${icon} ${label} | ⏳ not found | — | — |\n`;
              }
            });

            const overallConclusion = run.conclusion;
            const overallEmoji = overallConclusion === 'success' ? '✅' : '❌';
            const overallStatus = overallConclusion === 'success' ? 'All checks passed' : 'Some checks failed';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;
            const artifactsUrl = `${runUrl}#artifacts`;

            const artifactLinks = [
              '<details>',
              '<summary>📦 Download Reports</summary>',
              '',
              'All detailed reports are available as artifacts in the workflow run:',
              '',
              `- [TypeScript Report](${artifactsUrl})`,
              `- [ESLint Report](${artifactsUrl})`,
              `- [Test & Coverage Report](${artifactsUrl})`,
              `- [Build Report](${artifactsUrl})`,
              `- [Security Audit Report](${artifactsUrl})`,
              `- [Prettier Report](${artifactsUrl})`,
              '',
              '</details>'
            ].join('\n');

            const bodyLines = [
              `## ${overallEmoji} CI Results for PR #${prNumber}`,
              '',
              `**PR:** ${prTitle}`,
              `**Author:** @${prAuthor}`,
              `**Commit:** \`${headSha}\``,
              `**Workflow Run:** [View Run](${runUrl})`,
              '',
              '---',
              '',
              '### 📊 Per-Job Results',
              '',
              resultsTable,
              '',
              `**Summary:** ${passCount} passed · ${failCount} failed · ${skipCount} skipped`,
              '',
              '---',
              '',
              '### 🚦 Overall Status',
              '',
              `**${overallStatus}**`,
              '',
              artifactLinks,
              '',
              '---',
              '',
              `*Last updated: ${new Date().toISOString()}*`
            ];

            const body = bodyLines.join('\n');

            // Find existing bot comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('CI Results for PR')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
              console.log("Updated existing CI comment");
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body
              });
              console.log("Created new CI comment");
            }

            // Update commit status check
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: headSha,
              state: overallConclusion === 'success' ? 'success' : 'failure',
              context: 'Ultimate CI / Overall',
              description: overallConclusion === 'success' ? 'All checks passed' : 'Some checks failed',
              target_url: runUrl
            });
            console.log("Commit status updated");
