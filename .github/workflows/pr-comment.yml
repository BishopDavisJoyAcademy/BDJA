name: 💬 PR Comment with Detailed CI Results

on:
  workflow_run:
    workflows: ["🚀 Ultimate CI — Setup, Type, Lint, Test, Build, Audit, Format, Commit"]
    types: [completed]

permissions:
  pull-requests: write
  issues: write
  actions: read
  checks: write

jobs:
  comment:
    name: 💬 Post PR Comment
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'

    steps:
      - name: 🔍 Find associated PR
        id: find-pr
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { data: pullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${run.head_branch}`
            });

            if (pullRequests.length === 0) {
              console.log("No open PR found for branch: " + run.head_branch);
              core.setOutput('found', 'false');
              return;
            }

            const pr = pullRequests[0];
            core.setOutput('found', 'true');
            core.setOutput('number', pr.number);
            core.setOutput('title', pr.title);
            core.setOutput('author', pr.user.login);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('base_sha', pr.base.sha);

      - name: 📋 Fetch job details from workflow run
        if: steps.find-pr.outputs.found == 'true'
        id: fetch-jobs
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.payload.workflow_run.id;

            const { data: jobsData } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId
            });

            const jobs = jobsData.jobs;
            const run = context.payload.workflow_run;

            const jobMap = {};
            jobs.forEach(job => {
              jobMap[job.name] = {
                conclusion: job.conclusion,
                status: job.status,
                url: job.html_url,
                started_at: job.started_at,
                completed_at: job.completed_at
              };
            });

            const getDuration = (job) => {
              if (!job.started_at || !job.completed_at) return 'N/A';
              const start = new Date(job.started_at);
              const end = new Date(job.completed_at);
              const secs = Math.round((end - start) / 1000);
              return secs < 60 ? `${secs}s` : `${Math.floor(secs/60)}m ${secs%60}s`;
            };

            const getEmoji = (conclusion) => {
              if (conclusion === 'success') return '✅';
              if (conclusion === 'failure') return '❌';
              if (conclusion === 'skipped') return '⏭️';
              if (conclusion === 'cancelled') return '🚫';
              return '⏳';
            };

            const relevantJobs = [
              { key: '📦 Setup & Cache', label: '📦 Setup' },
              { key: '📝 Commit Lint', label: '📝 Commit' },
              { key: '🔍 TypeScript', label: '🔍 TypeScript' },
              { key: '🧹 ESLint', label: '🧹 ESLint' },
              { key: '🧪 Tests & Coverage', label: '🧪 Tests' },
              { key: '🏗️ Build', label: '🏗️ Build' },
              { key: '🔒 Security Audit', label: '🔒 Audit' },
              { key: '✨ Prettier', label: '✨ Prettier' },
              { key: '📊 Final Summary', label: '📊 Summary' }
            ];

            let resultsTable = '| Check | Status | Duration | Link |\n';
            resultsTable += '|-------|--------|----------|------|\n';

            let passCount = 0;
            let failCount = 0;
            let skipCount = 0;

            relevantJobs.forEach(({ key, label }) => {
              const job = jobMap[key];
              if (job) {
                const emoji = getEmoji(job.conclusion);
                const duration = getDuration(job);
                const link = `[Logs](${job.url})`;
                resultsTable += `| ${label} | ${emoji} ${job.conclusion} | ${duration} | ${link} |\n`;

                if (job.conclusion === 'success') passCount++;
                else if (job.conclusion === 'failure') failCount++;
                else if (job.conclusion === 'skipped') skipCount++;
              } else {
                resultsTable += `| ${label} | ⏳ not found | — | — |\n`;
              }
            });

            const overallConclusion = run.conclusion;
            const overallEmoji = overallConclusion === 'success' ? '✅' : '❌';
            const overallStatus = overallConclusion === 'success' ? 'All checks passed' : 'Some checks failed';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;
            const artifactsUrl = `${runUrl}#artifacts`;

            const artifactLinks = `
<details>
<summary>📦 Download Reports</summary>

All detailed reports are available as artifacts in the workflow run:

- [TypeScript Report](${artifactsUrl})
- [ESLint Report](${artifactsUrl})
- [Test & Coverage Report](${artifactsUrl})
- [Build Report](${artifactsUrl})
- [Security Audit Report](${artifactsUrl})
- [Prettier Report](${artifactsUrl})

</details>
`;

            const body = `## ${overallEmoji} CI Results for PR #${{ steps.find-pr.outputs.number }}

**PR:** ${{ steps.find-pr.outputs.title }}  
**Author:** @${{ steps.find-pr.outputs.author }}  
**Commit:** \`${{ steps.find-pr.outputs.head_sha }}\`  
**Workflow Run:** [View Run](${runUrl})

---

### 📊 Per-Job Results

${resultsTable}

**Summary:** ${passCount} passed · ${failCount} failed · ${skipCount} skipped

---

### 🚦 Overall Status

**${overallStatus}**

${artifactLinks}

---

*Last updated: ${new Date().toISOString()}*
`;

            core.setOutput('body', body);
            core.setOutput('conclusion', overallConclusion);

      - name: 💬 Post or Update PR Comment
        if: steps.find-pr.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ steps.find-pr.outputs.number }}');
            const body = `${{ steps.fetch-jobs.outputs.body }}`;
            const conclusion = '${{ steps.fetch-jobs.outputs.conclusion }}';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('CI Results for PR')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
              console.log("✅ Updated existing CI comment");
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body
              });
              console.log("✅ Created new CI comment");
            }

      - name: 🏷️ Update commit status check
        if: steps.find-pr.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const conclusion = '${{ steps.fetch-jobs.outputs.conclusion }}';
            const prNumber = parseInt('${{ steps.find-pr.outputs.number }}');
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.payload.workflow_run.id}`;

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ steps.find-pr.outputs.head_sha }}',
              state: conclusion === 'success' ? 'success' : 'failure',
              context: 'Ultimate CI / Overall',
              description: conclusion === 'success' ? 'All checks passed' : 'Some checks failed',
              target_url: runUrl
            });
            console.log("✅ Commit status updated");
