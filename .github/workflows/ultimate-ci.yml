name: 🚀 Ultimate CI — Setup, Type, Lint, Test, Build, Audit, Format, Commit

on:
  push:
    branches: [main, master, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [main, master, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip test & coverage job"
        required: false
        default: "false"
      skip_audit:
        description: "Skip security audit"
        required: false
        default: "false"
      skip_build:
        description: "Skip build step"
        required: false
        default: "false"
      skip_format_fix:
        description: "Skip auto-format fix on PR"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  CI: true
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  setup:
    name: 📦 Setup & Cache
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    outputs:
      cache-key: ${{ steps.cache.outputs.cache-primary-key }}
      node-modules-cached: ${{ steps.cache.outputs.cache-hit }}

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 🗝️ Restore node_modules
        uses: actions/cache/restore@v4
        id: cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: 📥 Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: 🔐 Validate lockfile integrity
        run: |
          echo "::group::Lockfile Validation"
          npm prune --dry-run 2>&1 | grep -q "up to date" && echo "✅ Lockfile valid" || {
            echo "❌ Lockfile out of sync. Run 'npm install' and commit the changes."
            exit 1
          }
          LOCKFILE_VERSION=$(node -e "console.log(require('./package-lock.json').lockfileVersion || 'unknown')")
          echo "Lockfile version: $LOCKFILE_VERSION"
          if [ "$LOCKFILE_VERSION" != "3" ] && [ "$LOCKFILE_VERSION" != "2" ]; then
            echo "⚠️ Unexpected lockfile version: $LOCKFILE_VERSION"
          fi
          echo "::endgroup::"

      - name: 💾 Save node_modules cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

  commit-lint:
    name: 📝 Commit Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: setup
    permissions:
      contents: read
    if: github.event_name == 'pull_request'

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🗝️ Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: 📝 Check commit messages
        run: |
          echo "::group::Commit Message Lint"
          if ! npx commitlint --version > /dev/null 2>&1; then
            echo "commitlint not found, installing temporarily..."
            npm install --no-save @commitlint/config-conventional @commitlint/cli 2>/dev/null || true
          fi

          if npx commitlint --version > /dev/null 2>&1; then
            npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose || {
              echo ""
              echo "❌ Commit messages do not follow conventional commit format."
              echo "   Expected format: type(scope): subject"
              echo "   Examples: feat(auth): add login, fix(ui): button alignment"
              exit 1
            }
            echo "✅ All commits follow conventional format"
          else
            echo "⚠️ commitlint not available, skipping commit lint"
          fi
          echo "::endgroup::"
        continue-on-error: true

  typecheck:
    name: 🔍 TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: setup
    permissions:
      contents: read
    outputs:
      result: ${{ steps.tsc.outputs.result }}
      errors: ${{ steps.tsc.outputs.errors }}
      duration: ${{ steps.tsc.outputs.duration }}

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🗝️ Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: 🔍 Run TypeScript
        id: tsc
        run: |
          START=$(date +%s)

          cat << 'HEADER' > tsc-report.txt
╔══════════════════════════════════════════════════════════════════════╗
║           TYPESCRIPT TYPE CHECK REPORT                               ║
╠══════════════════════════════════════════════════════════════════════╣
HEADER
          echo "  Repository  : ${{ github.repository }}" >> tsc-report.txt
          echo "  Branch      : ${{ github.ref_name }}" >> tsc-report.txt
          echo "  Commit      : ${{ github.sha }}" >> tsc-report.txt
          echo "  Actor       : ${{ github.actor }}" >> tsc-report.txt
          echo "  Timestamp   : $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> tsc-report.txt
          echo "╠══════════════════════════════════════════════════════════════════════╣" >> tsc-report.txt
          echo "" >> tsc-report.txt

          npx tsc --noEmit --pretty 2>&1 | tee -a tsc-report.txt || true
          CODE=${PIPESTATUS[0]}

          ERRORS=$(grep -cE "^.*error TS[0-9]+" tsc-report.txt || echo "0")
          END=$(date +%s)
          DURATION=$((END - START))

          echo "" >> tsc-report.txt
          echo "╠══════════════════════════════════════════════════════════════════════╣" >> tsc-report.txt
          echo "  Duration    : ${DURATION}s" >> tsc-report.txt
          echo "  Errors      : $ERRORS" >> tsc-report.txt
          echo "  Exit Code   : $CODE" >> tsc-report.txt

          if [ $CODE -eq 0 ]; then
            echo "  Status      : ✅ PASSED" >> tsc-report.txt
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "  Status      : ❌ FAILED" >> tsc-report.txt
            echo "result=fail" >> "$GITHUB_OUTPUT"
            echo "errors=$ERRORS" >> "$GITHUB_OUTPUT"
          fi
          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"
          echo "╚══════════════════════════════════════════════════════════════════════╝" >> tsc-report.txt
          cat tsc-report.txt
          exit $CODE
        continue-on-error: true

      - name: 📤 Upload tsc report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsc-report-${{ github.run_id }}
          path: tsc-report.txt
          retention-days: 14

  lint:
    name: 🧹 ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: setup
    permissions:
      contents: read
    outputs:
      result: ${{ steps.eslint.outputs.result }}
      errors: ${{ steps.eslint.outputs.errors }}
      warnings: ${{ steps.eslint.outputs.warnings }}

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🗝️ Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: 🧹 Run ESLint
        id: eslint
        run: |
          if ! npx eslint --version > /dev/null 2>&1; then
            echo "result=skipped" >> "$GITHUB_OUTPUT"
            echo "errors=0" >> "$GITHUB_OUTPUT"
            echo "warnings=0" >> "$GITHUB_OUTPUT"
            echo "⚠️ ESLint not installed. Skipping."
            exit 0
          fi

          npx eslint . --ext .ts,.tsx,.js,.jsx --format json --max-warnings 0 > eslint-results.json 2>&1 || true
          CODE=$?

          ERRORS=$(node -e "
            const fs = require('fs');
            try {
              const results = JSON.parse(fs.readFileSync('eslint-results.json', 'utf8'));
              const errorCount = results.reduce((sum, file) => sum + file.errorCount, 0);
              console.log(errorCount);
            } catch { console.log('0'); }
          ")

          WARNINGS=$(node -e "
            const fs = require('fs');
            try {
              const results = JSON.parse(fs.readFileSync('eslint-results.json', 'utf8'));
              const warningCount = results.reduce((sum, file) => sum + file.warningCount, 0);
              console.log(warningCount);
            } catch { console.log('0'); }
          ")

          npx eslint . --ext .ts,.tsx,.js,.jsx --format stylish --max-warnings 0 2>&1 | tee eslint-report.txt || true

          echo "errors=$ERRORS" >> "$GITHUB_OUTPUT"
          echo "warnings=$WARNINGS" >> "$GITHUB_OUTPUT"

          if [ $CODE -eq 0 ]; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
            echo "✅ ESLint passed — clean code!"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
            echo "❌ ESLint found $ERRORS error(s) and $WARNINGS warning(s)."
          fi
          exit $CODE
        continue-on-error: true

      - name: 📤 Upload eslint report
        if: always() && steps.eslint.outputs.result != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report-${{ github.run_id }}
          path: eslint-report.txt
          retention-days: 14

  test:
    name: 🧪 Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: setup
    permissions:
      contents: read
    outputs:
      result: ${{ steps.test.outputs.result }}
      passed: ${{ steps.test.outputs.passed }}
      failed: ${{ steps.test.outputs.failed }}
      coverage: ${{ steps.test.outputs.coverage }}

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🗝️ Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: 🧪 Run tests
        id: test
        run: |
          if [ "${{ github.event.inputs.skip_tests }}" == "true" ]; then
            echo "result=skipped" >> "$GITHUB_OUTPUT"
            echo "passed=0" >> "$GITHUB_OUTPUT"
            echo "failed=0" >> "$GITHUB_OUTPUT"
            echo "coverage=N/A" >> "$GITHUB_OUTPUT"
            echo "⏭️ Tests skipped via workflow dispatch."
            exit 0
          fi

          if ! grep -q '"test"' package.json; then
            echo "result=skipped" >> "$GITHUB_OUTPUT"
            echo "passed=0" >> "$GITHUB_OUTPUT"
            echo "failed=0" >> "$GITHUB_OUTPUT"
            echo "coverage=N/A" >> "$GITHUB_OUTPUT"
            echo "⚠️ No test script in package.json. Skipping."
            exit 0
          fi

          if grep -q "vitest" package.json; then
            RUNNER="vitest"
            CMD="npx vitest run --coverage"
          elif grep -q "jest" package.json; then
            RUNNER="jest"
            CMD="npx jest --coverage --coverageReporters=text-summary --coverageReporters=lcov"
          else
            RUNNER="npm"
            CMD="npm test"
          fi

          echo "Detected test runner: $RUNNER"
          echo "::group::Test Output"
          $CMD 2>&1 | tee test-report.txt || true
          CODE=${PIPESTATUS[0]}
          echo "::endgroup::"

          PASSED=$(grep -oE "[0-9]+ passed" test-report.txt | grep -oE "[0-9]+" | head -1 || echo "0")
          FAILED=$(grep -oE "[0-9]+ failed" test-report.txt | grep -oE "[0-9]+" | head -1 || echo "0")

          COVERAGE="N/A"
          if [ -f "coverage/lcov-report/index.html" ] || [ -f "coverage/index.html" ]; then
            COVERAGE=$(node -e "
              const fs = require('fs');
              try {
                const html = fs.readFileSync('coverage/lcov-report/index.html', 'utf8');
                const match = html.match(/([0-9.]+)%/);
                console.log(match ? match[1] + '%' : 'N/A');
              } catch {
                console.log('N/A');
              }
            ")
          fi

          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "coverage=$COVERAGE" >> "$GITHUB_OUTPUT"

          if [ $CODE -eq 0 ]; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
            echo "✅ All tests passed! Coverage: $COVERAGE"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
            echo "❌ Tests failed. Passed: $PASSED, Failed: $FAILED"
          fi
          exit $CODE
        continue-on-error: true

      - name: 📤 Upload test report
        if: always() && steps.test.outputs.result != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.run_id }}
          path: |
            test-report.txt
            coverage/
          retention-days: 14

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: setup
    permissions:
      contents: read
    outputs:
      result: ${{ steps.build.outputs.result }}
      size: ${{ steps.build.outputs.size }}
      pages: ${{ steps.build.outputs.pages }}
      bundle_size: ${{ steps.build.outputs.bundle_size }}

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🗝️ Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: 🔄 Restore Next.js build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: 🔧 Setup build environment
        run: |
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder-anon-key"
            echo "NEXT_PUBLIC_APP_URL=https://bdja.ac.ke"
            echo "NEXT_PUBLIC_ADMIN_SEGMENT=admin"
            echo "AEVIBRON_API_KEY=placeholder-api-key"
          } > .env.local
          echo "✅ Created placeholder .env.local for CI build"

      - name: 🏗️ Run build
        id: build
        run: |
          if [ "${{ github.event.inputs.skip_build }}" == "true" ]; then
            echo "result=skipped" >> "$GITHUB_OUTPUT"
            echo "⏭️ Build skipped via workflow dispatch."
            exit 0
          fi

          if ! grep -q '"build"' package.json; then
            echo "result=skipped" >> "$GITHUB_OUTPUT"
            echo "⚠️ No build script in package.json. Skipping."
            exit 0
          fi

          START=$(date +%s)
          npm run build 2>&1 | tee build-report.txt || true
          CODE=${PIPESTATUS[0]}
          END=$(date +%s)
          DURATION=$((END - START))

          SIZE="N/A"
          PAGES="0"
          BUNDLE_SIZE="N/A"

          if [ -d ".next" ]; then
            SIZE=$(du -sh .next | cut -f1)
            PAGES=$(find .next/server -name "*.html" 2>/dev/null | wc -l)

            if [ -f ".next/build-manifest.json" ]; then
              BUNDLE_SIZE=$(node -e "
                const fs = require('fs');
                try {
                  const manifest = JSON.parse(fs.readFileSync('.next/build-manifest.json', 'utf8'));
                  let total = 0;
                  const pages = manifest.pages || {};
                  Object.values(pages).forEach(files => {
                    files.forEach(f => {
                      try { total += fs.statSync('.next/' + f).size; } catch {}
                    });
                  });
                  console.log((total / 1024 / 1024).toFixed(2) + ' MB');
                } catch { console.log('N/A'); }
              ")
            fi
          elif [ -d "dist" ]; then
            SIZE=$(du -sh dist | cut -f1)
          elif [ -d "build" ]; then
            SIZE=$(du -sh build | cut -f1)
          fi

          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "pages=$PAGES" >> "$GITHUB_OUTPUT"
          echo "bundle_size=$BUNDLE_SIZE" >> "$GITHUB_OUTPUT"

          echo "" >> build-report.txt
          echo "═══════════════════════════════════════════════════════════════" >> build-report.txt
          echo "  Build Duration : ${DURATION}s" >> build-report.txt
          echo "  Output Size    : $SIZE" >> build-report.txt
          echo "  Pages Built    : $PAGES" >> build-report.txt
          echo "  Bundle Size    : $BUNDLE_SIZE" >> build-report.txt
          echo "═══════════════════════════════════════════════════════════════" >> build-report.txt

          if [ $CODE -eq 0 ]; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
            echo "✅ Build succeeded in ${DURATION}s | Size: $SIZE | Pages: $PAGES | Bundle: $BUNDLE_SIZE"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
            echo "❌ Build failed after ${DURATION}s."
          fi
          exit $CODE
        continue-on-error: true

      - name: 💾 Save Next.js build cache
        if: always() && steps.build.outputs.result == 'pass'
        uses: actions/cache/save@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}

      - name: 📤 Upload build report
        if: always() && steps.build.outputs.result != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: build-report-${{ github.run_id }}
          path: |
            build-report.txt
            .next/
          retention-days: 7

  audit:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: setup
    permissions:
      contents: read
    outputs:
      result: ${{ steps.audit.outputs.result }}
      vulnerabilities: ${{ steps.audit.outputs.vulns }}
      deprecated: ${{ steps.audit.outputs.deprecated }}

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🗝️ Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: 🔒 Run npm audit
        id: audit
        run: |
          if [ "${{ github.event.inputs.skip_audit }}" == "true" ]; then
            echo "result=skipped" >> "$GITHUB_OUTPUT"
            echo "vulns=0" >> "$GITHUB_OUTPUT"
            echo "deprecated=0" >> "$GITHUB_OUTPUT"
            echo "⏭️ Audit skipped via workflow dispatch."
            exit 0
          fi

          npm audit --audit-level=moderate --json > audit-results.json 2>&1 || true
          CODE=$?

          VULNS=$(node -e "
            const fs = require('fs');
            try {
              const data = JSON.parse(fs.readFileSync('audit-results.json', 'utf8'));
              const c = data.metadata?.vulnerabilities || {};
              console.log((c.critical||0)+(c.high||0)+(c.moderate||0)+(c.low||0));
            } catch { console.log('0'); }
          ")

          DEPRECATED=$(npm outdated --json 2>/dev/null | node -e "
            const fs = require('fs');
            try {
              const data = JSON.parse(fs.readFileSync(0, 'utf8'));
              console.log(Object.keys(data).length);
            } catch { console.log('0'); }
          ")

          npm audit --audit-level=moderate 2>&1 | tee audit-report.txt || true
          echo "" >> audit-report.txt
          echo "═══════════════════════════════════════════════════════════════" >> audit-report.txt
          npm outdated 2>/dev/null | tee -a audit-report.txt || true
          echo "═══════════════════════════════════════════════════════════════" >> audit-report.txt

          echo "vulns=$VULNS" >> "$GITHUB_OUTPUT"
          echo "deprecated=$DEPRECATED" >> "$GITHUB_OUTPUT"

          if [ $CODE -eq 0 ]; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
            echo "✅ No security vulnerabilities. $DEPRECATED package(s) outdated."
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
            echo "❌ $VULNS vulnerability(ies) found. $DEPRECATED package(s) outdated."
          fi
          exit $CODE
        continue-on-error: true

      - name: 📤 Upload audit report
        if: always() && steps.audit.outputs.result != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: audit-report-${{ github.run_id }}
          path: audit-report.txt
          retention-days: 14

  format:
    name: ✨ Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: setup
    permissions:
      contents: write
    outputs:
      result: ${{ steps.prettier.outputs.result }}
      fixed: ${{ steps.prettier.outputs.fixed }}

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🗝️ Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: ✨ Check formatting
        id: prettier
        run: |
          if ! npx prettier --version > /dev/null 2>&1; then
            echo "result=skipped" >> "$GITHUB_OUTPUT"
            echo "fixed=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Prettier not installed. Skipping."
            exit 0
          fi

          npx prettier --check "**/*.{ts,tsx,js,jsx,json,md,css,html}" 2>&1 | tee prettier-report.txt || true
          CODE=${PIPESTATUS[0]}

          if [ $CODE -eq 0 ]; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
            echo "fixed=false" >> "$GITHUB_OUTPUT"
            echo "✅ All files are properly formatted."
            exit 0
          fi

          echo "❌ Formatting issues found."

          if [ "${{ github.event_name }}" == "pull_request" ] && [ "${{ github.event.inputs.skip_format_fix }}" != "true" ]; then
            echo "🔧 Attempting auto-fix..."
            npx prettier --write "**/*.{ts,tsx,js,jsx,json,md,css,html}" 2>/dev/null || true

            if [ -n "$(git status --porcelain)" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add .
              git commit -m "style: auto-fix formatting via CI [skip ci]" || true
              git push || true
              echo "fixed=true" >> "$GITHUB_OUTPUT"
              echo "✅ Auto-fixed and pushed formatting changes."
              echo "result=pass" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "result=fail" >> "$GITHUB_OUTPUT"
          echo "fixed=false" >> "$GITHUB_OUTPUT"
          echo "❌ Formatting issues remain. Run 'npx prettier --write .' to fix."
          exit 1
        continue-on-error: true

      - name: 📤 Upload prettier report
        if: always() && steps.prettier.outputs.result != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: prettier-report-${{ github.run_id }}
          path: prettier-report.txt
          retention-days: 14

  summary:
    name: 📊 Final Summary
    runs-on: ubuntu-latest
    needs: [setup, typecheck, lint, test, build, audit, format]
    if: always()
    permissions:
      contents: read

    steps:
      - name: 📊 Generate Summary
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"

          echo "## 🚀 Ultimate CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** [\`${{ github.sha }}\`]($COMMIT_URL) by ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|---------|" >> $GITHUB_STEP_SUMMARY

          TSC="${{ needs.typecheck.outputs.result }}"
          TSC_ERR="${{ needs.typecheck.outputs.errors }}"
          TSC_DUR="${{ needs.typecheck.outputs.duration }}"
          if [ "$TSC" == "pass" ]; then
            echo "| 🔍 TypeScript | ✅ Pass | No errors · ${TSC_DUR}s |" >> $GITHUB_STEP_SUMMARY
          elif [ "$TSC" == "fail" ]; then
            echo "| 🔍 TypeScript | ❌ Fail | $TSC_ERR error(s) · ${TSC_DUR}s |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🔍 TypeScript | ⚠️ Unknown | — |" >> $GITHUB_STEP_SUMMARY
          fi

          LINT="${{ needs.lint.outputs.result }}"
          LINT_ERR="${{ needs.lint.outputs.errors }}"
          LINT_WARN="${{ needs.lint.outputs.warnings }}"
          if [ "$LINT" == "pass" ]; then
            echo "| 🧹 ESLint | ✅ Pass | Clean code |" >> $GITHUB_STEP_SUMMARY
          elif [ "$LINT" == "fail" ]; then
            echo "| 🧹 ESLint | ❌ Fail | $LINT_ERR error(s), $LINT_WARN warning(s) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🧹 ESLint | ⏭️ Skipped | Not installed |" >> $GITHUB_STEP_SUMMARY
          fi

          TEST="${{ needs.test.outputs.result }}"
          TEST_PASS="${{ needs.test.outputs.passed }}"
          TEST_FAIL="${{ needs.test.outputs.failed }}"
          TEST_COV="${{ needs.test.outputs.coverage }}"
          if [ "$TEST" == "pass" ]; then
            echo "| 🧪 Tests | ✅ Pass | $TEST_PASS passed · Coverage: $TEST_COV |" >> $GITHUB_STEP_SUMMARY
          elif [ "$TEST" == "fail" ]; then
            echo "| 🧪 Tests | ❌ Fail | $TEST_FAIL failed · Coverage: $TEST_COV |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🧪 Tests | ⏭️ Skipped | No test script |" >> $GITHUB_STEP_SUMMARY
          fi

          BUILD="${{ needs.build.outputs.result }}"
          BUILD_SIZE="${{ needs.build.outputs.size }}"
          BUILD_PAGES="${{ needs.build.outputs.pages }}"
          BUILD_BUNDLE="${{ needs.build.outputs.bundle_size }}"
          if [ "$BUILD" == "pass" ]; then
            echo "| 🏗️ Build | ✅ Pass | Size: $BUILD_SIZE · Pages: $BUILD_PAGES · Bundle: $BUILD_BUNDLE |" >> $GITHUB_STEP_SUMMARY
          elif [ "$BUILD" == "fail" ]; then
            echo "| 🏗️ Build | ❌ Fail | Build error |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🏗️ Build | ⏭️ Skipped | No build script |" >> $GITHUB_STEP_SUMMARY
          fi

          AUDIT="${{ needs.audit.outputs.result }}"
          AUDIT_VULN="${{ needs.audit.outputs.vulnerabilities }}"
          AUDIT_DEP="${{ needs.audit.outputs.deprecated }}"
          if [ "$AUDIT" == "pass" ]; then
            echo "| 🔒 Security Audit | ✅ Pass | No vulnerabilities · $AUDIT_DEP outdated |" >> $GITHUB_STEP_SUMMARY
          elif [ "$AUDIT" == "fail" ]; then
            echo "| 🔒 Security Audit | ❌ Fail | $AUDIT_VULN vuln(s) · $AUDIT_DEP outdated |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🔒 Security Audit | ⏭️ Skipped | — |" >> $GITHUB_STEP_SUMMARY
          fi

          FORMAT="${{ needs.format.outputs.result }}"
          FORMAT_FIXED="${{ needs.format.outputs.fixed }}"
          if [ "$FORMAT" == "pass" ]; then
            if [ "$FORMAT_FIXED" == "true" ]; then
              echo "| ✨ Prettier | ✅ Pass | Auto-fixed by bot |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| ✨ Prettier | ✅ Pass | Formatted |" >> $GITHUB_STEP_SUMMARY
            fi
          elif [ "$FORMAT" == "fail" ]; then
            echo "| ✨ Prettier | ❌ Fail | Format issues remain |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| ✨ Prettier | ⏭️ Skipped | Not installed |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📄 [View Full Run & Artifacts]($RUN_URL)" >> $GITHUB_STEP_SUMMARY

      - name: 🚦 Deploy Readiness Gate
        run: |
          TSC="${{ needs.typecheck.outputs.result }}"
          LINT="${{ needs.lint.outputs.result }}"
          TEST="${{ needs.test.outputs.result }}"
          BUILD="${{ needs.build.outputs.result }}"
          AUDIT="${{ needs.audit.outputs.result }}"
          FORMAT="${{ needs.format.outputs.result }}"

          FAILS=0
          [ "$TSC" == "fail" ] && ((FAILS++))
          [ "$LINT" == "fail" ] && ((FAILS++))
          [ "$BUILD" == "fail" ] && ((FAILS++))

          WARNS=0
          [ "$TEST" == "fail" ] && ((WARNS++))
          [ "$AUDIT" == "fail" ] && ((WARNS++))
          [ "$FORMAT" == "fail" ] && ((WARNS++))

          echo ""
          echo "╔════════════════════════════════════════════════════════════════════╗"
          if [ $FAILS -eq 0 ] && [ $WARNS -eq 0 ]; then
            echo "║  ✅ ALL CHECKS PASSED — DEPLOY READY                             ║"
            echo "║                                                                    ║"
            echo "║  Safe to deploy to Vercel! 🚀                                    ║"
            echo "╚════════════════════════════════════════════════════════════════════╝"
            echo "deploy_ready=true" >> "$GITHUB_ENV"
          elif [ $FAILS -eq 0 ]; then
            echo "║  ⚠️ ALL CRITICAL CHECKS PASSED — $WARNS WARNING(S)               ║"
            echo "║                                                                    ║"
            echo "║  Deployable, but review warnings first.                          ║"
            echo "╚════════════════════════════════════════════════════════════════════╝"
            echo "deploy_ready=warn" >> "$GITHUB_ENV"
          else
            echo "║  ❌ $FAILS CRITICAL CHECK(S) FAILED                              ║"
            echo "║                                                                    ║"
            echo "║  Fix errors before deploying.                                    ║"
            echo "║  Download reports from Artifacts.                                ║"
            echo "╚════════════════════════════════════════════════════════════════════╝"
            echo "deploy_ready=false" >> "$GITHUB_ENV"
            exit 1
          fi
